name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publishPackage:
        description: Publish the package to NuGet.org
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Uk.Legislation.slnx

      - name: Build library
        run: dotnet build Uk.Legislation/Uk.Legislation.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Uk.Legislation.Test/Uk.Legislation.Test.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Pack library
        run: dotnet pack Uk.Legislation/Uk.Legislation.csproj --configuration Release --no-build --output ./nupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: nupkg/*
          if-no-files-found: error

  publish:
    needs: build-test-pack
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && inputs.publishPackage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Uk.Legislation.slnx

      - name: Pack library
        run: dotnet pack Uk.Legislation/Uk.Legislation.csproj --configuration Release --output ./nupkg

      - name: Publish package
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
